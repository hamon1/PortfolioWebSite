spring:
  profiles:
    active: local
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:portfolio}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
  jwt-secret: ${JWT_SECRET}
  jwt-expiry-ms: ${JWT_EXPIRY_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hamon1.github.io}

server:
  port: 8080
