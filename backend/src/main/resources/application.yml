spring:
  profiles:
    active: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
  jwt-secret: ${JWT_SECRET}
  jwt-expiry-ms: ${JWT_EXPIRY_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hamon1.github.io}

server:
  port: 8080
